name: parity-ptero-v1

x-ptero-mail: &ptero-mail
  MAIL_FROM: "noreply@parity.local"
  MAIL_DRIVER: "smtp"
  MAIL_HOST: "127.0.0.1"
  MAIL_PORT: "1025"
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
  MAIL_ENCRYPTION: "true"

services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_DATABASE: panel
      MYSQL_USER: pterodactyl
      MYSQL_PASSWORD: pteropass
      MYSQL_ROOT_PASSWORD: pteroroot
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  panel:
    image: ghcr.io/pterodactyl/panel:v1.15.2
    # Keep image CMD explicitly — overriding entrypoint alone drops it in Compose.
    entrypoint: ["/bin/ash", "/parity/ptero-entrypoint.sh"]
    command: ["supervisord", "-n", "-c", "/etc/supervisord.conf"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:80"
    volumes:
      - panel_var:/app/var
      - panel_nginx:/etc/nginx/http.d
      - panel_logs:/app/storage/logs
      - ../scripts/ptero-entrypoint.sh:/parity/ptero-entrypoint.sh:ro
    environment:
      APP_URL: "http://127.0.0.1:8081"
      APP_TIMEZONE: "UTC"
      APP_SERVICE_AUTHOR: "noreply@parity.local"
      APP_ENV: "production"
      APP_ENVIRONMENT_ONLY: "false"
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: panel
      DB_USERNAME: pterodactyl
      DB_PASSWORD: pteropass
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_DRIVER: redis
      REDIS_HOST: redis
      HASHIDS_LENGTH: 8
      <<: *ptero-mail
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

volumes:
  panel_var:
  panel_nginx:
  panel_logs:
