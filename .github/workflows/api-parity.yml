name: API Parity

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: api-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parity:
    name: Pterodactyl v1 / v2 / FeatherPanel
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install rsync
        run: sudo apt-get update -qq && sudo apt-get install -y rsync

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Run API parity suite
        working-directory: tests/api-parity
        run: |
          chmod +x scripts/*.sh
          ./scripts/run-all.sh

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-parity-report
          path: |
            tests/api-parity/.credentials/parity-report.json
            tests/api-parity/.credentials/*.env
          if-no-files-found: ignore
          retention-days: 14

      - name: Dump compose logs on failure
        if: failure()
        working-directory: tests/api-parity
        run: |
          docker compose -f docker-compose.yml ps || true
          docker compose -f docker-compose.yml logs --no-color --tail=200 > /tmp/parity-compose-logs.txt || true
          cat /tmp/parity-compose-logs.txt

      - name: Upload compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-parity-compose-logs
          path: /tmp/parity-compose-logs.txt
          if-no-files-found: ignore
          retention-days: 14
