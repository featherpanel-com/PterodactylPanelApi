name: API Parity

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: api-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  catalog:
    name: Route catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Application + Client route catalogs
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          const ROOT = process.cwd();
          const FIXTURES = path.join(ROOT, 'tests/api-parity/fixtures');
          const normalize = (p) => p.replace(/\{[^}]+\}/g, '{id}').replace(/\/+/g, '/').replace(/\/$/, '') || '/';
          const key = (m, p) => `${m.toUpperCase()} ${normalize(p)}`;
          function extract(dir, prefix) {
            const routes = [];
            for (const file of fs.readdirSync(dir)) {
              if (!file.endsWith('.php')) continue;
              const text = fs.readFileSync(path.join(dir, file), 'utf8');
              const re = /new Route\(\s*'([^']+)'[\s\S]*?\[['"]([A-Z, ]+)['"]\]/g;
              let m;
              while ((m = re.exec(text))) {
                if (!m[1].startsWith(prefix)) continue;
                for (const method of m[2].split(',').map((x) => x.trim()).filter(Boolean)) {
                  routes.push(key(method, m[1]));
                }
              }
            }
            return new Set(routes);
          }
          const appPlugin = extract(path.join(ROOT, 'Routes/Application'), '/api/application');
          const appV1 = new Set(JSON.parse(fs.readFileSync(path.join(FIXTURES, 'ptero-v1-application-routes.json'), 'utf8')).map((r) => key(r.method, r.path)));
          const appMissing = [...appV1].filter((k) => !appPlugin.has(k)).sort();
          const appExtra = [...appPlugin].filter((k) => !appV1.has(k)).sort();
          const clientPlugin = extract(path.join(ROOT, 'Routes/Client'), '/api/client');
          const clientV1 = new Set(JSON.parse(fs.readFileSync(path.join(FIXTURES, 'ptero-v1-client-routes.json'), 'utf8')).map((r) => key(r.method, r.path)));
          const clientMissing = [...clientV1].filter((k) => !clientPlugin.has(k)).sort();
          console.log(JSON.stringify({
            application: { plugin: appPlugin.size, v1: appV1.size, missing: appMissing, extra: appExtra },
            client: { plugin: clientPlugin.size, v1: clientV1.size, missing: clientMissing },
          }, null, 2));
          if (appMissing.length || appExtra.length) process.exit(1);
          if (clientPlugin.size < 20) process.exit(1);
          EOF

  ptero-v1:
    name: Pterodactyl v1
    needs: [catalog]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - name: Boot + capture
        working-directory: tests/api-parity
        run: |
          chmod +x scripts/*.sh
          ./scripts/run-panel.sh ptero-v1
      - name: Upload snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-ptero-v1
          path: |
            tests/api-parity/.artifacts/ptero-v1.json
            tests/api-parity/.artifacts/ptero-v1-compose.log
          if-no-files-found: ignore
          retention-days: 7

  ptero-v2:
    name: Pterodactyl v2
    needs: [catalog]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - name: Boot + capture
        working-directory: tests/api-parity
        run: |
          chmod +x scripts/*.sh
          ./scripts/run-panel.sh ptero-v2
      - name: Upload snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-ptero-v2
          path: |
            tests/api-parity/.artifacts/ptero-v2.json
            tests/api-parity/.artifacts/ptero-v2-compose.log
          if-no-files-found: ignore
          retention-days: 7

  feather:
    name: FeatherPanel + plugin
    needs: [catalog]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install rsync
        run: sudo apt-get update -qq && sudo apt-get install -y rsync
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - name: Boot + capture
        working-directory: tests/api-parity
        run: |
          chmod +x scripts/*.sh
          ./scripts/run-panel.sh feather
      - name: Upload snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-feather
          path: |
            tests/api-parity/.artifacts/feather.json
            tests/api-parity/.artifacts/feather-compose.log
          if-no-files-found: ignore
          retention-days: 7

  compare:
    name: Compare 1:1
    runs-on: ubuntu-latest
    needs: [catalog, ptero-v1, ptero-v2, feather]
    if: always()
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require panel jobs
        run: |
          echo "catalog=${{ needs.catalog.result }}"
          echo "ptero-v1=${{ needs.ptero-v1.result }}"
          echo "ptero-v2=${{ needs.ptero-v2.result }}"
          echo "feather=${{ needs.feather.result }}"
          test "${{ needs.catalog.result }}" = "success"
          test "${{ needs.ptero-v1.result }}" = "success"
          test "${{ needs.ptero-v2.result }}" = "success"
          test "${{ needs.feather.result }}" = "success"
      - name: Download snapshots
        uses: actions/download-artifact@v4
        with:
          pattern: snapshot-*
          path: tests/api-parity/.artifacts
          merge-multiple: true
      - name: Compare snapshots
        working-directory: tests/api-parity
        run: |
          node scripts/compare-snapshots.mjs \
            .artifacts/ptero-v1.json \
            .artifacts/ptero-v2.json \
            .artifacts/feather.json
      - name: Upload report + OpenAPI schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-parity-report
          path: |
            tests/api-parity/.artifacts/parity-report.json
            tests/api-parity/.artifacts/openapi.parity.json
          if-no-files-found: ignore
          retention-days: 14
